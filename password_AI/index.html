<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Password Generator</title>

    <link rel="stylesheet" href="/password_AI/css/styles.css">
    <script src="js/scripts.js" defer></script>
</head>

<body>

<div id="register-container">

    <!-- Banner -->
    <div id="register-banner">
        <div id="banner-layer">
            <h1>Welcome</h1>
            <h2>Create your account</h2>

            <p>
                Register to use all the system features.
            </p>
        </div>
    </div>

    <!-- Formulário -->
    <div id="register-form">

        <form>

            <div class="form-control">
                <label for="name">Name</label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name">
            </div>

            <div class="form-control">
                <label for="email">E-mail</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email">
            </div>

            <div class="form-control">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password">
            </div>

            <p>
                Need help creating a secure password?

                <span id="generate-password">
                    Click here.
                </span>
            </p>

            <div id="generated-password">
                <p>Here is your password:</p>
                <h4></h4>
            </div>

            <div class="form-control">
                <label for="passwordconfirm">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="passwordconfirm"
                    name="passwordconfirm"
                    placeholder="Confirm your password">
            </div>

            <input
                type="submit"
                value="Register">

        </form>

    </div>

</div>

</body>
</html>
