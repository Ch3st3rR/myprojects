<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Generator</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/password/css/styles.css" />

    <script src="js/scripts.js" defer></script>
  </head>

  <body>
    <div id="register-container">
      <!-- Banner -->
      <div id="register-banner">
        <div id="banner-layer">
          <div class="banner-content">
            <h1>Welcome</h1>
            <h2>Create your account</h2>
            <p>Register to use all the system features.</p>
          </div>
        </div>
      </div>

      <!-- Form -->
      <div id="register-form">
        <form>
          <h2></h2>

          <div class="form-control">
            <label for="name">Name</label>

            <input
              type="text"
              id="name"
              name="name"
              placeholder="Enter your name"
            />
          </div>

          <div class="form-control">
            <label for="email">E-mail</label>

            <input
              type="email"
              id="email"
              name="email"
              placeholder="Enter your email"
            />
          </div>

          <div class="form-control">
            <label for="password">Password</label>

            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
            />
          </div>

          <p>
            Need help creating a secure password?
            <span id="open-generate-password"> Click here. </span>
          </p>
          <div id="generate-options" class="hide">
            <p>Select options that you wish</p>

            <div class="form-control">
              <label for="length">Character count:</label>
              <input
                type="number"
                id="length"
                name="length"
                value="10"
                min="4"
                max="30"
              />
            </div>

            <div class="form-control">
              <label for="letters">Letters:</label>
              <input type="checkbox" id="letters" checked />
            </div>

            <div class="form-control">
              <label for="numbers">Numbers:</label>
              <input type="checkbox" id="numbers" checked />
            </div>

            <div class="form-control">
              <label for="symbols">Symbols:</label>
              <input type="checkbox" id="symbols" checked />
            </div>

            <button type="button" id="generate-password">
              Create Password
            </button>
          </div>
          <div id="generated-password" class="hide">
            <p>Here is your password:</p>
            <h4></h4>
            <button type="button" id="copy-password">Copy</button>
          </div>

          <div class="form-control">
            <label for="passwordconfirm"> Confirm Password </label>

            <input
              type="password"
              id="passwordconfirm"
              name="passwordconfirm"
              placeholder="Confirm your password"
            />
          </div>

          <input type="submit" value="Register" />
        </form>
      </div>
    </div>
  </body>
</html>
